<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Hasan Berat Kaylan</title>
  <desc id="d">Independent open-source developer building local-first, privacy-respecting software.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#14213A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="ca"><circle cx="830" cy="140" r="58"/></clipPath>
  </defs>

  <rect width="1000" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="280" rx="16" fill="url(#grid)"/>
  <rect width="1000" height="280" rx="16" fill="url(#glow)"/>

  <!-- Intersection motif -->
  <circle cx="900" cy="140" r="58" fill="url(#accent)" fill-opacity="0.28" clip-path="url(#ca)"/>
  <circle cx="830" cy="140" r="58" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="900" cy="140" r="58" fill="none" stroke="#818CF8" stroke-width="2"/>
  <circle cx="865" cy="140" r="3.5" fill="#F8FAFC"/>

  <!-- Text -->
  <rect x="60" y="78" width="56" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="60" y="144" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1" fill="#F8FAFC">Hasan Berat Kaylan</text>
  <text x="60" y="196" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#94A3B8">Independent Open-Source Developer</text>
</svg>
